name: Item intake

# Lets you add a baseball or bobblehead from your phone via a GitHub issue
# form (see .github/ISSUE_TEMPLATE/). This never exposes the local admin
# screen (tools/admin-server.mjs) — it only reads/writes the repo through the
# normal GitHub Actions + pull request flow.

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: intake-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  intake:
    if: >
      !github.event.issue.pull_request &&
      (contains(github.event.issue.labels.*.name, 'new-baseball') ||
       contains(github.event.issue.labels.*.name, 'new-bobblehead'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Process issue
        id: process
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: node scripts/intake.mjs

      - name: Open pull request
        id: pr
        if: steps.process.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: >-
            Add ${{ steps.process.outputs.item-type }}: ${{ steps.process.outputs.item-title }}
            (#${{ github.event.issue.number }})
          branch: intake/issue-${{ github.event.issue.number }}
          delete-branch: true
          title: >-
            Add ${{ steps.process.outputs.item-type }}: ${{ steps.process.outputs.item-title }}
          body: >-
            Closes #${{ github.event.issue.number }}


            Submitted via the "${{ steps.process.outputs.item-type == 'baseball' && 'New baseball' || 'New bobblehead' }}"
            issue form. Review the photo(s) and details, then merge to publish.
          labels: intake

      - name: Comment success
        if: steps.process.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prUrl = '${{ steps.pr.outputs.pull-request-url }}';
            const warning = `${{ steps.process.outputs.warning }}`;
            let body = `Opened ${prUrl} with this item. Merge it to publish — nothing is live yet.`;
            if (warning) body += `\n\n⚠️ ${warning}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Comment failure
        if: steps.process.outputs.changed == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const error = `${{ steps.process.outputs.error }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Couldn't process this yet: ${error}\n\nEdit the issue to fix it — this runs again automatically.`
            });
